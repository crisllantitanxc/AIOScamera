name: Gerar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -project AIOScamera.xcodeproj \
            -target AIOScamera \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AIOScamera.app Payload/
          zip -qry AIOScamera.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AIOScamera-ipa
          path: AIOScamera.ipa
